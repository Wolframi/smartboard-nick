        let currentEditCard = { oldTitle: '', column: '', relPath: '', images: [] };

        let loadBoardThrottle = null;
        function dataSignature(data) {
            if (!data || !data.length) return '';
            return data.map(c => (c.folder || c.name) + ':' + (c.tasks || []).map(t =>
            (t.relPath || '') + ':' + (t.title || '') + ':' + (t.deadline || '') + ':' + (Array.isArray(t.participants) ? t.participants.join(',') : '') + ':' + (Array.isArray(t.images) ? t.images.length : 0) + ':' + (t.done ? '1' : '0')
            ).join(';')).join('|');
        }
        function showBoardError(msg) {
            const board = document.getElementById('board');
            if (!board) return;
            board.innerHTML = '<div class="empty-message"><div class="board-error">' + escapeHtml(String(msg || 'Ошибка загрузки')) + '</div><button type="button" class="btn-retry-board" onclick="forceReload()">Повторить</button></div>';
        }
        async function loadBoard() {
            if (!currentBoardId) return;
            if (isDragging || isCreatingColumn || isRenamingColumn || isRenamingBoard || isEditingCard || isModalOpen) return; 
            if (Date.now() - lastActionTime < 1500) return;

            try {
                await ensureUserLists(currentBoardId);
                const res = await fetch(getBoardApiUrl('/board'));
                if (!res.ok) {
                    let errMsg = res.status + ': ' + res.statusText;
                    const txt = await res.text().catch(() => '');
                    try {
                        const errData = JSON.parse(txt);
                        if (errData && errData.error) errMsg = errData.error;
                    } catch (e) {
                        if (txt) errMsg = txt;
                    }
                    if (res.status === 403) {
                        currentBoardId = '';
                        currentBoardName = '';
                        updateBoardUrl('');
                        await loadBoardsList().catch(() => {});
                        showBoardsScreen();
                    }
                    throw new Error(errMsg);
                }
                const raw = await res.json();
                const data = Array.isArray(raw) ? raw : [];
                
                const isMenuOpen = document.querySelector('.column-dropdown.show');
                if (isMenuOpen && dataSignature(data) !== dataSignature(lastData)) return;
                if (lastData && dataSignature(data) === dataSignature(lastData)) return; 
                
                lastData = data;
                if (loadBoardThrottle) cancelAnimationFrame(loadBoardThrottle);
                loadBoardThrottle = requestAnimationFrame(() => { loadBoardThrottle = null; render(data); });
            } catch(e) {
                console.error(e);
                showBoardError(e.message || 'Ошибка сети');
            }
        }

        function forceReload() {
            lastData = null; lastActionTime = 0; 
            isEditingCard = false; isCreatingColumn = false;
            isRenamingColumn = false; isRenamingBoard = false;
            loadBoard();
        }

        function pauseUpdates() { lastActionTime = Date.now(); }

        function getCurrentUser() {
            return (typeof window.__currentUserName !== 'undefined' && window.__currentUserName) ? window.__currentUserName : '';
        }
        let columnSortModes = {};
        function sortColumnFromBtn(el) { const c = el.dataset.sortCol; const f = el.dataset.sortFolder; const m = el.dataset.sortMode; if ((c || f) && m) sortColumn(c, f, m); }
        function sortColumn(colName, colFolder, mode) {
            document.querySelectorAll('.column-dropdown.show').forEach(m => m.classList.remove('show'));
            if (!lastData) return;
            const col = lastData.find(c => (colFolder && c.folder === colFolder) || c.name === colName);
            if (!col || !col.tasks.length) return;
            const key = colFolder || colName;
            if (mode) columnSortModes[key] = mode;
            const me = getCurrentUser();
            let ordered = col.tasks.slice();
            if (mode === 'alphabet') ordered.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ru'));
            else if (mode === 'myParticipant' && me) ordered.sort((a, b) => { const ap = (a.participants || []).some(p => String(p).trim() === me); const bp = (b.participants || []).some(p => String(p).trim() === me); if (ap && !bp) return -1; if (!ap && bp) return 1; return 0; });
            let colDiv = null;
            document.querySelectorAll('.column').forEach(el => { if (el.getAttribute('data-folder') === (colFolder || colName)) colDiv = el; });
            if (!colDiv) return;
            const taskList = colDiv.querySelector('.task-list');
            if (!taskList) return;
            const cards = Array.from(taskList.querySelectorAll('.card'));
            const byRelPath = {};
            cards.forEach(c => { const r = (c.getAttribute('data-rel-path') || '').replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>'); byRelPath[r] = c; });
            ordered.forEach(t => { const r = (t.relPath || '').replace(/\\/g, '/'); const el = byRelPath[r]; if (el) taskList.appendChild(el); });
        }

        // --- ОТРИСОВКА ---
        function renderTaskCardHtml(t, me) {
            const currentMe = me !== undefined ? me : getCurrentUser();
            const safeRelPath = (t.relPath || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const authorName = t.author && t.author.author ? String(t.author.author).trim() : '';
            const authorLabel = authorName ? formatCardUserLabel(authorName) : '';
            const authorHtml = authorName
                ? `<div class="card-author" title="${escapeHtml(authorName)}${t.author && t.author.email ? ' · ' + escapeHtml(t.author.email) : ''}">${renderUserAvatarHtml(authorName, 'sm')}<span class="card-author-name">${escapeHtml(authorLabel)}</span></div>`
                : '';
            const partList = t.participants || [];
            const iAmParticipant = currentMe && partList.some(p => String(p).trim() === currentMe);
            const partClass = iAmParticipant ? ' card-i-am-participant' : '';
            let imagesHtml = '';
            if (t.images && t.images.length > 0) {
                const imgBase = `${BASE_URL}/images/${(t.relPath || '').replace(/\\/g, '/')}`;
                imagesHtml = t.images.map(imgName => `<img src="${imgBase}/${encodeURIComponent(imgName)}" class="card-img" loading="lazy" draggable="false" data-full="${imgBase}/${encodeURIComponent(imgName)}" data-title="${escapeHtml(t.title)}" onclick="viewImage(event, this)">`).join('');
                imagesHtml = `<div class="card-gallery">${imagesHtml}</div>`;
            }
            const isDone = t.done || localStorage.getItem(`done_${t.relPath}`) === 'true';
            const doneClass = isDone ? 'card-done' : '';
            const checkMark = isDone ? '✅ ' : '';
            const safeTitle = escapeHtml(t.title);
            const previewDesc = t.desc ? escapeHtml(String(t.desc).replace(/<[^>]+>/g, '').slice(0, 120)) : '';
            const participantsHtml = renderCardParticipants(partList, currentMe, authorName);
            let dateClass = 'card-date';
            if (t.deadline && !isDone) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const dl = new Date(t.deadline);
                dl.setHours(0, 0, 0, 0);
                const diffDays = Math.round((dl - today) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) dateClass += ' date-overdue';
                else if (diffDays <= 1) dateClass += ' date-urgent';
            }
            return `<div class="card ${doneClass}${partClass}" data-rel-path="${safeRelPath}" onclick="openEditModal(this)">

                ${previewDesc ? `<div class="card-preview-desc">${previewDesc}</div>` : ''}

        function openEditModal(cardEl) {

            if (!task) return;
            const title = task.title, desc = task.desc || '', date = task.deadline || '', images = task.images || [], participants = task.participants || [];
            const authorName = (task.author && task.author.author && String(task.author.author).trim()) ? String(task.author.author).trim() : '';
            // done UI may use localStorage fallback — baseline must match what's shown

            currentEditCard = { oldTitle: title, originalDesc: desc || '', originalDate: date || '', originalDone: doneChecked, originalParticipants: participants.slice(), originalImages: images.slice(), column: colFolder, columnDisplay: colName, relPath: relPath, images: images.slice(), pendingImages: [], imagesToDelete: [], participants: participants.slice(), authorName };

        function hasUnsavedChanges() {
            const title = (document.getElementById('edit-card-title') ? document.getElementById('edit-card-title').value : '').trim();
            const date = document.getElementById('edit-card-date') ? document.getElementById('edit-card-date').value : '';
            const done = !!(document.getElementById('edit-card-done') && document.getElementById('edit-card-done').checked);
            const desc = normalizeDescHtml(getDescHtml());
            const origTitle = String(currentEditCard.oldTitle || '').trim();
            const origDesc = normalizeDescHtml(currentEditCard.originalDesc || '');
            const origDate = currentEditCard.originalDate || '';
            const origDone = !!currentEditCard.originalDone;
            const partEq = (a, b) => a.length === b.length && a.every((p, i) => p === b[i]);
            return (title !== origTitle) ||
                (desc !== origDesc) ||
                (date !== origDate) ||
                (done !== origDone) ||
                !partEq(currentEditCard.participants || [], currentEditCard.originalParticipants || []) ||
                ((currentEditCard.pendingImages || []).length > 0) ||
                ((currentEditCard.imagesToDelete || []).length > 0);
        }
        async function closeEditModal(forceClose) {
            if (!forceClose && hasUnsavedChanges()) {
                const choice = await showUnsavedChangesConfirm();
                if (choice === 'save') {
                    saveCardEdit();
                    return;
                }
                if (choice === 'cancel') return;
                // discard — close without saving
            }
            const modal = document.getElementById('cardEditModal');
            toggleModalParticipantPicker(false);

            let closed = false;
            const finishClose = () => {
                if (closed) return;
                closed = true;
                if (modal._closeAnimTimer) {
                    clearTimeout(modal._closeAnimTimer);
                    modal._closeAnimTimer = null;
                }
                if (modal._closeOnEnd) {
                    modal.removeEventListener('animationend', modal._closeOnEnd);
                    modal._closeOnEnd = null;
                }
                modal.classList.remove('is-closing');
                modal.style.display = 'none';
                isModalOpen = false;
                forceReload();
            };

            if (!modal || modal.style.display === 'none') {
                isModalOpen = false;
                forceReload();
                return;
            }
            if (modal.classList.contains('is-closing')) return;

            if (prefersReducedMotion()) {
                finishClose();
                return;
            }

            modal.classList.add('is-closing');
            const onEnd = (e) => {
                if (e.target !== modal) return;
                finishClose();
            };
            modal._closeOnEnd = onEnd;
            modal.addEventListener('animationend', onEnd);
            modal._closeAnimTimer = setTimeout(finishClose, 360);
        }

        // --- ДОБАВЛЕНИЕ ФОТО (drag-and-drop, выбор файла) ---
        function fileToPngBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) { reject(new Error('Не изображение')); return; }
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось загрузить изображение')); };
                img.src = url;
            });
        }
        function addPendingPhoto(base64Png) {
            if (!currentEditCard.relPath) return;
            currentEditCard.pendingImages = currentEditCard.pendingImages || [];
            currentEditCard.pendingImages.push({ dataUrl: base64Png });
            renderModalPhotos();
        }
        async function processPhotoFiles(files) {
            if (!files || !files.length || !currentEditCard.relPath) return;
            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                if (!f.type.startsWith('image/')) continue;
                try {
                    const base64 = await fileToPngBase64(f);
                    addPendingPhoto(base64);
                } catch (e) { alert('Ошибка: ' + (e.message || e)); }
            }
        }
        function initPhotoDropzone() {
            const dropzone = document.getElementById('modal-photo-dropzone');
            const fileInput = document.getElementById('modal-photo-file-input');
            const modalWindow = document.querySelector('.modal-card-window');
            if (!dropzone || !fileInput) return;
            dropzone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => { processPhotoFiles(e.target.files); fileInput.value = ''; };
            const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); if (dropzone) dropzone.classList.add('drag-over'); };
            const handleDragLeave = (e) => { e.preventDefault(); e.stopPropagation(); if (dropzone) dropzone.classList.remove('drag-over'); };
            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (dropzone) dropzone.classList.remove('drag-over');
                if (currentEditCard.relPath && e.dataTransfer.files) processPhotoFiles(e.dataTransfer.files);
            };
            dropzone.ondragover = handleDragOver;
            dropzone.ondragleave = handleDragLeave;
            dropzone.ondrop = handleDrop;
            if (modalWindow) {
                modalWindow.ondragover = (e) => { e.preventDefault(); if (dropzone) dropzone.classList.add('drag-over'); };
                modalWindow.ondragleave = (e) => { if (e.relatedTarget && modalWindow.contains(e.relatedTarget)) return; if (dropzone) dropzone.classList.remove('drag-over'); };
                modalWindow.ondrop = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (dropzone) dropzone.classList.remove('drag-over');
                    if (currentEditCard.relPath && e.dataTransfer.files) processPhotoFiles(e.dataTransfer.files);
                };
            }
        }

        // --- УДАЛЕНИЕ ФОТО (только из интерфейса, на сервер — при сохранении) ---
        async function deleteImage(e, btnEl) {
            e.stopPropagation();
            const imgName = btnEl.dataset.imgName;
            const pendingIdx = btnEl.dataset.pendingIndex !== undefined ? parseInt(btnEl.dataset.pendingIndex, 10) : -1;
            if (!imgName && pendingIdx < 0) return;
            const answer = await showDeleteConfirm('Удалить это фото?', 'Удаление фото');
            if (answer !== 'delete') return;
            if (pendingIdx >= 0) {
                currentEditCard.pendingImages = currentEditCard.pendingImages || [];
                currentEditCard.pendingImages.splice(pendingIdx, 1);
            } else {
                currentEditCard.images = (currentEditCard.images || []).filter(img => img !== imgName);
                currentEditCard.imagesToDelete = currentEditCard.imagesToDelete || [];
                currentEditCard.imagesToDelete.push(imgName);
            }
            renderModalPhotos();
        }

        async function saveCardEdit() {
            const newTitle = document.getElementById('edit-card-title').value;
            const newDate = document.getElementById('edit-card-date').value;
            const isDone = document.getElementById('edit-card-done').checked;
            const newDesc = getDescHtml();

            // done теперь хранится на сервере — localStorage не нужен
            localStorage.removeItem(`done_${currentEditCard.relPath}`);

            pauseUpdates();
            try {
                // Загружаем новые фото
                const pending = currentEditCard.pendingImages || [];
                for (const item of pending) {
                    const res = await fetch(`${API_URL}/update-ticket`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(withBoardId({ relPath: currentEditCard.relPath, image: item.dataUrl }))
                    });
                    if (!res.ok) throw new Error('Ошибка загрузки фото');
                }
                // Удаляем с сервера фото, которые пользователь убрал
                const toDelete = currentEditCard.imagesToDelete || [];
                for (const imgName of toDelete) {
                    const fullPathToImg = currentEditCard.relPath + '/' + imgName;
                    await fetch(`${API_URL}/delete`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(withBoardId({ relPath: fullPathToImg, isColumn: false })) });
                }
                const r1 = await fetch(`${API_URL}/update-ticket`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(withBoardId({ relPath: currentEditCard.relPath, newTitle: newTitle, newDesc: newDesc, newDate: newDate, newDone: isDone }))
                });
                if (!r1.ok) { const d = await r1.json().catch(() => ({})); throw new Error(d.error || 'Ошибка сохранения: ' + r1.status); }
                const r2 = await fetch(`${API_URL}/ticket-participants`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(withBoardId({ relPath: currentEditCard.relPath, participants: currentEditCard.participants || [] }))
                });
                if (!r2.ok) { const d = await r2.json().catch(() => ({})); throw new Error(d.error || 'Ошибка участников: ' + r2.status); }

                // Мгновенно обновляем карточку в DOM и в lastData — done и заголовок видны сразу
                const relPathNorm = (currentEditCard.relPath || '').replace(/\\/g, '/');
                const cardEl = Array.from(document.querySelectorAll('.card')).find(c => {

        // WebSocket — автообновление с дедупликацией, heartbeat и экспоненциальным переподключением
        let ws; let wsRefreshTimer = null;
        let wsReconnectDelay = 3000;
        let wsHeartbeatTimer = null;

        function wsResetHeartbeat() {
            clearTimeout(wsHeartbeatTimer);
            // Если 45 секунд нет активности — считаем соединение мёртвым, переподключаемся
            wsHeartbeatTimer = setTimeout(() => { try { ws && ws.close(); } catch (e) {} }, 45000);
        }

        function connectWs() {
            try {
                ws = new WebSocket(WS_URL);
                ws.onopen = () => { wsReconnectDelay = 3000; wsResetHeartbeat(); };
                ws.onmessage = (e) => {
                    wsResetHeartbeat();
                    try {
                        const d = JSON.parse(e.data);
                        if (d.type === 'ping') { ws.send(JSON.stringify({ type: 'pong' })); return; }
                        if (d.type !== 'refresh') return;
                        if (d.boardsListChanged && !isRenamingBoard) {
                            loadBoardsList().then(() => {
                                const b = availableBoards.find(x => x.id === currentBoardId);
                                if (b) setCurrentBoard(b);
                            });
                        }
                        if (d.boardDeleted && d.boardId) {
                            isRenamingBoard = false;
                            if (d.boardId === currentBoardId) {
                                currentBoardId = '';
                                currentBoardName = '';
                                updateBoardUrl('');
                                const titleEl = document.getElementById('board-title');
                                if (titleEl) titleEl.textContent = 'SmartBoard';
                                lastData = null;
                                lastActionTime = 0;
                                loadBoardsList().then(() => showBoardsScreen());
                            } else {
                                loadBoardsList();
                            }
                            return;
                        }
                        if (d.boardId && currentBoardId && d.boardId !== currentBoardId) return;
                        // Дебаунс: серия refresh подряд приводит к одному перерендеру.
                        if (wsRefreshTimer) clearTimeout(wsRefreshTimer);
                        const doRefresh = () => {
                            wsRefreshTimer = null;
                            // Не сбиваем локальный pause (создание карточки и т.п.) полной перерисовкой
                            const wait = 1500 - (Date.now() - lastActionTime);
                            if (wait > 0) {
                                wsRefreshTimer = setTimeout(doRefresh, wait + 40);
                                return;
                            }
                            lastData = null;
                            lastActionTime = 0;
                            loadBoard();
                        };
                        wsRefreshTimer = setTimeout(doRefresh, 200);
                    } catch (err) {}
                };
                ws.onclose = () => {
                    clearTimeout(wsHeartbeatTimer);
                    setTimeout(connectWs, wsReconnectDelay);
                    wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000);
                };
                ws.onerror = () => {};
            } catch (err) {}
        }
        connectWs();
        // Резервный поллинг только когда WS недоступен (иначе обновления и так приходят по сокету).
        setInterval(() => { if (!ws || ws.readyState !== 1) loadBoard(); }, 120000);

            if (doneBtn) {
                doneBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeAllColumnMenus();
                    toggleDoneFilterDropdown();
                });
            }
            if (columnSearch) {
                columnSearch.addEventListener('input', () => renderColumnFilterList());
                columnSearch.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        if (columnSearch.value) {
                            columnSearch.value = '';
                            renderColumnFilterList();
                        } else {
                            toggleColumnFilterDropdown(false);
                        }
                    }
                });
            }
            if (columnList) {
                columnList.addEventListener('change', (e) => {
                    const t = e.target;
                    if (!t || !t.classList.contains('column-filter-check')) return;
                    const checks = Array.from(columnList.querySelectorAll('.column-filter-check'));
                    const visibleKeys = new Set(checks.map(c => c.getAttribute('data-column-key') || '').filter(Boolean));
                    const checkedVisible = checks.filter(c => c.checked).map(c => c.getAttribute('data-column-key') || '').filter(Boolean);
                    const kept = selectedColumnKeys.filter(k => !visibleKeys.has(k));
                    setColumnFilterSelection(kept.concat(checkedVisible), true);
                });
            }
            if (btnColAll) {
                btnColAll.addEventListener('click', (e) => {
                    e.preventDefault();
                    clearColumnFilterSelection(true);
                });
            }
            if (peopleSearch) {
                peopleSearch.addEventListener('input', () => renderPeopleFilterList());
                peopleSearch.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        e.stopPropagation();
                        if (peopleSearch.value) {
                            peopleSearch.value = '';
                            renderPeopleFilterList();
                        } else {
                            togglePeopleFilterDropdown(false);
                        }
                    }
                });
            }
            if (peopleList) {
                peopleList.addEventListener('change', (e) => {
                    const t = e.target;
                    if (!t || !t.classList.contains('people-filter-check')) return;
                    const checks = Array.from(peopleList.querySelectorAll('.people-filter-check'));
                    const visibleNames = new Set(checks.map(c => c.getAttribute('data-person-name') || '').filter(Boolean));
                    const checkedVisible = checks.filter(c => c.checked).map(c => c.getAttribute('data-person-name') || '').filter(Boolean);
                    // Keep selections hidden by search query
                    const kept = preferredPeopleNames.filter(n => !visibleNames.has(n));
                    setPeopleFilterSelection(kept.concat(checkedVisible), true);
                });
            }
            if (btnMe) {
                btnMe.addEventListener('click', (e) => {
                    e.preventDefault();
                    setPeopleFilterMe(true);
                });
            }
            if (btnAll) {
                btnAll.addEventListener('click', (e) => {
                    e.preventDefault();
                    clearPeopleFilterSelection(true);
                });
            }
            if (doneDd) {
                doneDd.addEventListener('change', (e) => {
                    const t = e.target;
                    if (!t || !t.classList.contains('done-filter-radio')) return;
                    setDoneFilterMode(t.value, true);
                    toggleDoneFilterDropdown(false);
                });
            }
            if (chipsRow) {
                chipsRow.addEventListener('click', (e) => {
                    const chip = e.target && e.target.closest ? e.target.closest('.filter-chip') : null;
                    if (!chip || !chipsRow.contains(chip) || chip.classList.contains('is-leaving')) return;
                    e.preventDefault();
                    e.stopPropagation();
                    removeBoardFilterChip(chip);
                });
            }
            document.addEventListener('click', (e) => {
                const inCol = columnWrap && columnWrap.contains(e.target);
                const inPeople = peopleWrap && peopleWrap.contains(e.target);
                const inDone = doneWrap && doneWrap.contains(e.target);
                if (!inCol && !inPeople && !inDone) closeBoardFilterDropdowns();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeBoardFilterDropdowns();
            });
            setBoardFiltersVisible(false);
        })();

        (async function boot() {
            await initUserData();
            await initBoards();
        })();
    </script>
</body>
</html>
