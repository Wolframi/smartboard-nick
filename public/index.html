<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SmartBoard</title>
    <script src="/libs/Sortable.min.js"></script>
    <link href="/libs/quill.snow.css" rel="stylesheet">
    <script src="/libs/quill.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="/avatars.js"></script>
    <style>
        .empty-message { padding: 40px; color: #6b778c; font-size: 18px; text-align: center; width: 100%; margin-top: 50px; }
        .board-error { padding: 20px; color: #c00; font-family: monospace; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
        .btn-retry-board { margin-top: 12px; background: #28a745; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn-retry-board:hover { background: #218838; }
        .date-overdue { color: #d93025 !important; font-weight: bold; }
        .date-urgent { color: #e37400 !important; font-weight: bold; }
        .card-gallery { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        #quill-editor { min-height: 120px; }
        .board-switch-btn { background: rgba(255,255,255,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; padding: 0 12px; height: 34px; cursor: pointer; font-size: 13px; line-height: 32px; box-sizing: border-box; transition: background 0.22s cubic-bezier(0.22, 1, 0.36, 1), transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
        .board-switch-btn:hover { background: rgba(255,255,255,0.32); transform: translateY(-1px); border-color: rgba(255,255,255,0.5); }
        .board-switch-btn:active { transform: translateY(0); }
        .column-header-title-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .column-title-text { overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <div id="boards-screen" class="boards-screen" style="display:none;">
        <div id="boards-screen-main-inner" class="boards-screen-inner">
            <div class="boards-screen-header">
                <div>
                    <h1 class="boards-screen-title">Доски</h1>
                    <p class="boards-screen-subtitle">Выберите существующую доску или создайте новую.</p>
                    <p id="boards-registered-line" class="boards-registered-line" style="display:none;">Вы вошли как <span id="boards-user-badge-wrap" class="user-avatar-wrap"></span></p>
                </div>
                <button type="button" id="btn-create-board" class="boards-create-btn">Создать доску</button>
            </div>
            <div id="boards-list" class="boards-grid"></div>
        </div>
    </div>

    <!-- Полноэкранное затемнение; кнопка «Зарегистрироваться» на одной линии с бывшей «Создать доску» (boards-create-btn) -->
    <div id="boards-reg-fullscreen" class="boards-reg-fs" style="display:none;">
        <div class="boards-reg-fs-inner">
            <div class="boards-reg-fs-header">
                <div>
                    <h1 class="boards-screen-title">Доски</h1>
                    <p class="boards-screen-subtitle">Укажите никнейм</p>
                </div>
                <div class="boards-reg-fs-actions">
                    <input type="text" id="input-fio-boards" class="header-fio-input" placeholder="Никнейм" maxlength="32" autocomplete="off">
                    <button type="button" id="btn-fio-boards" class="boards-create-btn">Зарегистрироваться</button>
                </div>
            </div>
            <div class="boards-reg-fs-dim-rest" aria-hidden="true"></div>
        </div>
    </div>

    <div id="createBoardModal" class="modal-overlay modal-overlay-global" style="display:none;">
        <div class="modal-card-window modal-small-window" onclick="event.stopPropagation()">
            <div class="modal-header modal-header-compact">
                <h3 class="modal-small-title">Создать доску</h3>
                <span class="close-edit-btn" onclick="closeCreateBoardModal()">×</span>
            </div>
            <div class="modal-body create-board-form">
                <div class="modal-form-row">
                    <label for="create-board-name-input" class="modal-form-label">Название</label>
                    <input type="text" id="create-board-name-input" class="modal-form-input" placeholder="Название доски" maxlength="120" autocomplete="off">
                </div>
                <label class="modal-form-checkbox-row" for="create-board-private-checkbox">
                    <input type="checkbox" id="create-board-private-checkbox">
                    <span class="modal-form-checkbox-text">
                        <span class="modal-form-checkbox-title">Приватная доска</span>
                        <span class="modal-form-checkbox-hint">Видна только вам и выбранным участникам. Следующим шагом выберите участников.</span>
                    </span>
                </label>
                <p id="create-board-error" class="modal-form-error" style="display:none;"></p>
            </div>
            <div class="modal-actions modal-actions-end">
                <button type="button" class="btn-delete-edit btn-modal-cancel" onclick="closeCreateBoardModal()">Отмена</button>
                <button type="button" id="btn-create-board-submit" class="btn-save-edit" onclick="submitCreateBoardModal()">Создать</button>
            </div>
        </div>
    </div>

    <div id="boardMembersModal" class="modal-overlay modal-overlay-global" style="display:none;">
        <div class="modal-card-window modal-board-members-window" onclick="event.stopPropagation()">
            <div class="modal-header modal-header-compact">
                <h3 class="modal-small-title">Участники доски</h3>
                <span class="close-edit-btn" onclick="closeBoardMembersModal()">×</span>
            </div>
            <div class="modal-body">
                <p id="board-members-modal-subtitle" class="board-members-subtitle"></p>
                <div class="board-members-picker">
                    <input type="search" id="board-members-filter" class="modal-form-input board-members-filter" placeholder="Поиск по имени..." autocomplete="off">
                    <div id="board-members-picker-list" class="board-members-picker-list"></div>
                </div>
            </div>
            <div class="modal-actions modal-actions-end">
                <button type="button" class="btn-delete-edit btn-modal-cancel" onclick="closeBoardMembersModal()">Отмена</button>
                <button type="button" class="btn-save-edit" onclick="saveBoardMembersModal().catch(e => alert(e.message || 'Ошибка'))">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="appConfirmModal" class="modal-overlay modal-overlay-global" style="display:none;" onclick="if(event.target===this) resolveAppConfirm('cancel')">
        <div class="modal-card-window modal-small-window app-confirm-window" onclick="event.stopPropagation()">
            <div class="modal-header modal-header-compact">
                <h3 id="app-confirm-title" class="modal-small-title">Подтверждение</h3>
                <span class="close-edit-btn" onclick="resolveAppConfirm('cancel')" title="Закрыть">×</span>
            </div>
            <div class="modal-body">
                <p id="app-confirm-message" class="app-confirm-message"></p>
            </div>
            <div class="modal-actions modal-actions-end app-confirm-actions" id="app-confirm-actions"></div>
        </div>
    </div>

    <div id="board-app" style="display:none;">
    <div class="header">
        <div class="header-main">
            <div class="header-brand">
                <h1 id="board-title">SmartBoard</h1>
                <div class="column-menu-wrapper header-board-menu" id="header-board-menu-wrap" style="display:none;">
                    <button type="button" class="btn-three-dots" onclick="toggleColumnMenu(event)" title="Меню доски">•••</button>
                    <div class="column-dropdown" id="header-board-menu-dropdown"></div>
                </div>
            </div>
            <div class="board-filters" id="board-filters">
                <div class="board-filter-wrap" id="column-filter-wrap">
                    <button type="button" id="btn-column-filter" class="board-column-filter-btn" title="Фильтр по колонкам">

                    </button>
                    <div id="column-filter-dropdown" class="column-filter-dropdown" onclick="event.stopPropagation()">
                        <div class="column-filter-actions people-filter-actions">
                            <button type="button" id="column-filter-all" class="column-filter-action-btn">Все</button>
                            <input type="search" id="column-filter-search" class="people-filter-search" placeholder="Поиск…" autocomplete="off">

                        <div id="column-filter-list" class="column-filter-list"></div>
                        <div id="column-filter-empty" class="column-filter-empty" style="display:none;">Нет колонок</div>

                </div>
                <div class="board-filter-wrap" id="people-filter-wrap">
                    <button type="button" id="btn-people-filter" class="board-column-filter-btn" title="Фильтр по участникам">
                        Участники<span id="people-filter-badge" class="column-filter-badge" hidden></span>
                    </button>
                    <div id="people-filter-dropdown" class="column-filter-dropdown" onclick="event.stopPropagation()">
                        <div class="column-filter-actions people-filter-actions">
                            <button type="button" id="people-filter-me" class="column-filter-action-btn">Я</button>
                            <button type="button" id="people-filter-all" class="column-filter-action-btn">Все</button>
                            <input type="search" id="people-filter-search" class="people-filter-search" placeholder="Поиск…" autocomplete="off">
                        </div>
                        <div id="people-filter-list" class="column-filter-list"></div>
                        <div id="people-filter-empty" class="column-filter-empty" style="display:none;">Нет участников</div>
                    </div>
                </div>
                <div class="board-filter-wrap" id="done-filter-wrap">
                    <button type="button" id="btn-done-filter" class="board-column-filter-btn" title="Фильтр по статусу">
                        <span id="done-filter-label">Статус</span>
                    </button>
                    <div id="done-filter-dropdown" class="column-filter-dropdown done-filter-dropdown" onclick="event.stopPropagation()">
                        <label class="column-filter-row done-filter-option">
                            <input type="radio" name="done-filter" class="done-filter-radio" value="all">
                            <span class="column-filter-row-name">Все карточки</span>
                        </label>
                        <label class="column-filter-row done-filter-option">
                            <input type="radio" name="done-filter" class="done-filter-radio" value="open">
                            <span class="column-filter-row-name">Не выполнено</span>
                        </label>
                        <label class="column-filter-row done-filter-option">
                            <input type="radio" name="done-filter" class="done-filter-radio" value="done">
                            <span class="column-filter-row-name">Выполнено</span>
                        </label>
                    </div>
                </div>
                <div class="board-filter-chips" id="board-filter-chips" aria-label="Активные фильтры"></div>
            </div>
            <button type="button" id="btn-board-switch" class="board-switch-btn">Доски</button>
        </div>
        <div class="header-user" id="header-user-block">
            <div id="user-registered-view" style="display:none;">
                <span id="header-user-avatar-wrap" class="user-avatar-wrap"></span>
            </div>
            <div id="user-registration-view" style="display:none;">
                <input type="text" id="input-fio-header" class="header-fio-input" placeholder="Введите никнейм" maxlength="32">
                <button type="button" id="btn-fio-header" class="btn-fio-header">Зарегистрироваться</button>
            </div>
        </div>

    <div id="board-overlay" class="board-overlay" style="display:none;"></div>
    
    <div class="board" id="board">Загрузка...</div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg">
        <div id="caption"></div>
    </div>

    <div id="cardEditModal" class="modal-overlay" style="display:none;">
        <div class="modal-card-window">
            <div class="modal-header">
                <input type="text" id="edit-card-title" class="title-input" value="Название задачи">
                <span class="close-edit-btn" onclick="closeEditModal()">×</span>
            </div>
            
            <div class="modal-meta">
                В колонке: <span id="edit-card-column" class="column-badge">...</span>

            <div class="modal-dates-row">

                    <div id="modal-participant-picker" class="modal-participant-picker" style="display:none;">
                        <input type="search" id="modal-participant-filter" class="modal-participant-filter" placeholder="Поиск по имени..." autocomplete="off">

            <div class="modal-photos-section">

                    <span class="dropzone-text">Перетащите фото сюда или нажмите для выбора</span>

            </div>

            <div class="modal-actions">
                <button class="btn-save-edit" onclick="saveCardEdit()">Сохранить изменения</button>
                <button class="btn-delete-edit" onclick="deleteOpenedCard()">Удалить карточку</button>
            </div>
        </div>
    </div>
    </div>

    <script>
        // API = тот хост, с которого открыта страница (IP определяется сам)
        const API_URL = (window.location.origin || ('http://' + window.location.hostname + (window.location.port ? ':' + window.location.port : ''))) + '/api';
        const BASE_URL = API_URL.replace(/\/api\/?$/, '');
        const WS_URL = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host;
        let currentBoardId = '';
        let currentBoardName = '';
        let availableBoards = [];

        function getBoardApiUrl(path) {
            const url = new URL(API_URL + path, window.location.origin);
            if (currentBoardId) url.searchParams.set('boardId', currentBoardId);
            return url.toString();
        }
        function withBoardId(payload) {
            return currentBoardId ? { ...(payload || {}), boardId: currentBoardId } : { ...(payload || {}) };
        }
        function updateBoardUrl(boardId) {
            const url = new URL(window.location.href);
            if (boardId) url.searchParams.set('board', boardId);
            else url.searchParams.delete('board');
            history.replaceState({}, '', url.toString());
        }
        function setCurrentBoard(board) {
            currentBoardId = board?.id || '';
            currentBoardName = board?.name || '';
            updateBoardUrl(currentBoardId);
            const titleEl = document.getElementById('board-title');
            if (titleEl) titleEl.textContent = currentBoardName ? `SmartBoard: ${currentBoardName}` : 'SmartBoard';
            updateHeaderBoardMenu();
            boardFiltersHydrated = false;
            loadBoardFiltersFromStorage();
            updatePeopleFilterBadge();
            updateDoneFilterUi();
            renderBoardFilterChips();
            loadCardUserList(currentBoardId).catch(() => {});
        }
        function getCurrentBoardMeta() {
            return availableBoards.find(b => b.id === currentBoardId) || null;
        }
        // PNG-иконки UI (папка /ico на сервере). Имена ASCII — без проблем с кодировкой в mount/Docker/URL.
        const ICO = {
            members: 'members.svg',
            lock: 'lock.svg',
            globe: 'globe.svg',
            trash: 'trash.svg',
            edit: 'edit.svg',
            camera: 'camera.svg',
            sort: 'SortAlphabet.svg'
        };
        function uiIcon(file, cls) {
            return `<img src="/ico/${file}" class="ui-icon${cls ? ' ' + cls : ''}" alt="" aria-hidden="true">`;
        }
        function isBoardOwner(board) {
            const me = getCurrentUser();
            const owner = board && board.owner ? String(board.owner).trim() : '';
            if (!owner) return false;
            return !!(me && me === owner);
        }
        function canManageBoard(board) {
            return isBoardOwner(board);
        }
        function canManageBoardMembers(board) {
            return !!(board && board.visibility === 'private' && isBoardOwner(board));
        }
        window.__allUserListNames = [];
        window.__cardUserListNames = [];
        async function loadAllUserList() {
            try {
                const r = await fetch(`${API_URL}/user-list`);
                const d = await r.json().catch(() => ({}));
                window.__allUserListNames = d.names || [];
            } catch (e) {}
            return window.__allUserListNames;
        }
        async function loadCardUserList(boardId) {
            const id = boardId || currentBoardId;
            if (!id) {
                window.__cardUserListNames = (window.__allUserListNames || []).slice();
                return window.__cardUserListNames;
            }
            try {
                const r = await fetch(`${API_URL}/user-list?boardId=${encodeURIComponent(id)}`);
                const d = await r.json().catch(() => ({}));
                window.__cardUserListNames = d.names || [];
            } catch (e) {
                window.__cardUserListNames = [];
            }
            return window.__cardUserListNames;
        }
        // Списки пользователей меняются редко — в фоновом poll/refresh не дёргаем их каждый раз.
        // При открытии модалок (openEditModal и т.п.) списки запрашиваются явно, поэтому остаются свежими.
        let _userListsBoardId = null, _userListsTs = 0;
        const USER_LISTS_TTL_MS = 60000;
        async function ensureUserLists(boardId, force) {
            const now = Date.now();
            if (!force && boardId === _userListsBoardId && (now - _userListsTs) < USER_LISTS_TTL_MS) return;
            await Promise.all([loadAllUserList(), loadCardUserList(boardId)]).catch(() => {});
            _userListsBoardId = boardId;
            _userListsTs = now;
        }
        function getCardPickerNames() {
            if (window.__cardUserListNames && window.__cardUserListNames.length) return window.__cardUserListNames;
            return window.__allUserListNames || [];
        }
        function buildParticipantSelectOptions(excluded) {
            const skip = new Set((excluded || []).filter(Boolean));
            return '<option value="">— Выберите —</option>' + getCardPickerNames()
                .filter(n => !skip.has(n))
                .map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`)
                .join('');
        }
        function renderModalParticipantPicker(excluded) {
            const list = document.getElementById('modal-participant-picker-list');
            const filterEl = document.getElementById('modal-participant-filter');
            if (!list) return;
            const q = (filterEl && filterEl.value || '').trim().toLowerCase();
            const skip = new Set((excluded || []).filter(Boolean));
            const names = getCardPickerNames().filter((n) => !skip.has(n) && (!q || n.toLowerCase().includes(q)));
            if (!names.length) {
                list.innerHTML = '<div class="modal-participant-picker-empty">Никого не найдено</div>';
                return;
            }
            list.innerHTML = names.map((n) => {
                const avatar = renderUserAvatarHtml(n, 'sm');
                const label = escapeHtml(formatCardUserLabel(n));
                const full = escapeHtml(n);
                return `<button type="button" class="modal-participant-picker-row" data-participant-name="${full}" title="${full}">${avatar}<span class="modal-participant-picker-name">${label}</span></button>`;
            }).join('');
        }
        function toggleModalParticipantPicker(forceOpen) {
            const picker = document.getElementById('modal-participant-picker');
            if (!picker) return;
            const open = forceOpen !== undefined ? forceOpen : picker.style.display === 'none';
            picker.style.display = open ? 'block' : 'none';
            if (open) {
                const filterEl = document.getElementById('modal-participant-filter');
                if (filterEl) filterEl.value = '';
                renderModalParticipantPicker(currentEditCard ? currentEditCard.participants : []);
                if (filterEl) filterEl.focus();
            }
        }
        function addParticipantFromPicker(name) {
            const n = String(name || '').trim();
            if (!n || !currentEditCard) return;
            if (!(currentEditCard.participants || []).includes(n)) {
                currentEditCard.participants.push(n);
                renderModalParticipants();
                renderModalParticipantPicker(currentEditCard.participants);
            }
        }
        let modalParticipantPickerBound = false;
        function ensureModalParticipantPickerBound() {
            if (modalParticipantPickerBound) return;
            modalParticipantPickerBound = true;
            const filterEl = document.getElementById('modal-participant-filter');
            const list = document.getElementById('modal-participant-picker-list');
            const btn = document.getElementById('btn-add-participant');
            if (filterEl) {
                filterEl.addEventListener('input', () => {
                    renderModalParticipantPicker(currentEditCard ? currentEditCard.participants : []);
                });
            }
            if (list) {
                list.addEventListener('click', (e) => {
                    const row = e.target.closest('.modal-participant-picker-row');
                    if (!row) return;
                    addParticipantFromPicker(row.getAttribute('data-participant-name') || '');
                });
            }
            if (btn) {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleModalParticipantPicker();
                });
            }
            document.addEventListener('click', (e) => {
                const picker = document.getElementById('modal-participant-picker');
                const addBtn = document.getElementById('btn-add-participant');
                if (!picker || picker.style.display === 'none') return;
                if (picker.contains(e.target) || (addBtn && addBtn.contains(e.target))) return;
                picker.style.display = 'none';
            });
        }
        function updateHeaderBoardMenu() {
            const wrap = document.getElementById('header-board-menu-wrap');
            const dropdown = document.getElementById('header-board-menu-dropdown');
            const board = getCurrentBoardMeta();
            if (!wrap || !dropdown) return;
            if (!board || !canManageBoard(board)) {
                wrap.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }
            wrap.style.display = 'inline-block';
            let html = '';
            if (canManageBoardMembers(board)) {
                html += `<div class="menu-item" onclick="openBoardMembersModalFromHeader(event)">${uiIcon(ICO.members, 'menu-icon')}Участники доски</div>`;
            }
            if (board.visibility === 'private') {
                html += `<div class="menu-item" onclick="setBoardVisibilityFromMenu(event, '${escapeHtml(board.id)}', false)">${uiIcon(ICO.globe, 'menu-icon')}Сделать общей</div>`;
            } else {
                html += `<div class="menu-item" onclick="setBoardVisibilityFromMenu(event, '${escapeHtml(board.id)}', true)">${uiIcon(ICO.lock, 'menu-icon')}Сделать приватной</div>`;
            }
            html += `<div class="menu-item delete-item" onclick="deleteBoardFromMenu(event, this)" data-board-id="${escapeHtml(board.id)}">${uiIcon(ICO.trash, 'menu-icon')}Удалить доску</div>`;
            dropdown.innerHTML = html;
        }
        function renderUserAvatarHtml(name, size) {
            return typeof renderUserAvatar === 'function' ? renderUserAvatar(name, size || 'sm') : '';
        }
        function renderUserAvatarWithNameHtml(name, size) {
            return typeof renderUserAvatarWithName === 'function'
                ? renderUserAvatarWithName(name, size || 'sm', true)
                : escapeHtml(name || '');
        }
        function formatCardUserLabel(name) {
            return typeof formatCardDisplayName === 'function'
                ? formatCardDisplayName(name)
                : String(name || '').trim();
        }
        function pluralRu(n, one, few, many) {
            const abs = Math.abs(Number(n)) % 100;
            const last = abs % 10;
            if (abs > 10 && abs < 20) return many;
            if (last === 1) return one;
            if (last >= 2 && last <= 4) return few;
            return many;
        }
        function formatPeopleCountRu(count) {
            const n = Math.abs(Number(count)) || 0;
            // 1 человек, 2 человека, 5 человек, 21 человек…
            return `Ещё ${n} ${pluralRu(n, 'человек', 'человека', 'человек')}`;
        }
        function formatPeopleMoreBadge(count) {
            const n = Math.abs(Number(count)) || 0;
            return '+' + n;
        }
        function buildCardParticipantsTooltipHtml(names, me) {
            if (!names || !names.length) return '';
            const title = formatPeopleCountRu(names.length);
            const rows = names.map((n) => {
                const meCls = (me && n === me) ? ' card-participants-tooltip-row-me' : '';
                const label = escapeHtml(formatCardUserLabel(n));
                const full = escapeHtml(n);
                return `<div class="card-participants-tooltip-row${meCls}" title="${full}">${renderUserAvatarHtml(n, 'sm')}<span class="card-participants-tooltip-name">${label}</span></div>`;
            }).join('');
            return `<div class="card-participants-tooltip-title">${escapeHtml(title)}</div><div class="card-participants-tooltip-list">${rows}</div>`;
        }
        // Все участники в DOM; сколько влезет — показываем, остальное в «+N» с tooltip.
        function renderCardParticipants(list, me, excludeName) {
            const skip = String(excludeName || '').trim();
            const names = (Array.isArray(list) ? list : [])
                .map(p => String(p == null ? '' : p).trim())
                .filter(p => p && p !== skip);
            if (!names.length) return '';
            const avatars = names.map((n) => {
                const meCls = (me && n === me) ? ' card-participant-me' : '';
                const safe = escapeHtml(n);
                return `<span class="card-participant-avatar${meCls}" data-participant-name="${safe}" title="${safe}">${renderUserAvatarHtml(n, 'sm')}</span>`;
            }).join('');
            const moreWrap = `<span class="card-participant-more-wrap is-hidden" hidden>
                <span class="card-participant-more" tabindex="0">+0</span>
                <span class="card-participants-tooltip" role="tooltip"></span>
            </span>`;
            return `<div class="card-participants">${avatars}${moreWrap}</div>`;
        }

        const CARD_PARTICIPANT_SIZE = 20;
        const CARD_PARTICIPANT_GAP = 3;

        function participantsRowWidth(itemCount) {
            if (itemCount <= 0) return 0;
            return itemCount * CARD_PARTICIPANT_SIZE + (itemCount - 1) * CARD_PARTICIPANT_GAP;
        }

        function measureParticipantsAvailable(footer) {
            const author = footer.querySelector('.card-author');
            return Math.max(48, footer.clientWidth - (author ? author.offsetWidth : 0) - 10);
        }

        function computeParticipantVisibleCount(total, available) {
            if (total <= 0) return 0;
            if (participantsRowWidth(total) <= available) return total;
            // «+N» занимает место как аватар — прячем минимум двоих, иначе ширина не уменьшается.
            for (let visible = total - 2; visible >= 1; visible--) {
                if (participantsRowWidth(visible + 1) <= available) return visible;
            }
            return 1;
        }

        function layoutCardParticipants(container) {
            if (!container) return;
            const footer = container.closest('.card-footer');
            if (!footer) return;
            const avatars = Array.from(container.querySelectorAll('.card-participant-avatar'));
            const moreWrap = container.querySelector('.card-participant-more-wrap');
            const moreEl = container.querySelector('.card-participant-more');
            const tooltipEl = container.querySelector('.card-participants-tooltip');
            if (!avatars.length) {
                if (moreWrap) moreWrap.hidden = true;
                container.removeAttribute('data-participant-visible');
                container.removeAttribute('data-participant-hidden');
                return;
            }

            const available = measureParticipantsAvailable(footer);
            const visibleCount = computeParticipantVisibleCount(avatars.length, available);
            const hiddenCount = avatars.length - visibleCount;
            const footerWidth = footer.clientWidth;
            const prevVisible = container.getAttribute('data-participant-visible');
            const prevHidden = container.getAttribute('data-participant-hidden');
            const prevFooterWidth = container.getAttribute('data-participant-footer-w');
            if (prevVisible === String(visibleCount) &&
                prevHidden === String(hiddenCount) &&
                prevFooterWidth === String(footerWidth)) {
                return;
            }
            container.setAttribute('data-participant-visible', String(visibleCount));
            container.setAttribute('data-participant-hidden', String(hiddenCount));
            container.setAttribute('data-participant-footer-w', String(footerWidth));

            avatars.forEach((a, i) => { a.hidden = i >= visibleCount; });
            if (hiddenCount > 0 && moreWrap && moreEl) {
                const hiddenNames = avatars.slice(visibleCount)
                    .map(a => a.getAttribute('data-participant-name') || '')
                    .filter(Boolean);
                const me = typeof getCurrentUser === 'function' ? getCurrentUser() : '';
                moreEl.textContent = formatPeopleMoreBadge(hiddenCount);
                moreEl.title = formatPeopleCountRu(hiddenCount);
                if (tooltipEl && !moreWrap.classList.contains('is-tooltip-open')) {
                    tooltipEl.innerHTML = buildCardParticipantsTooltipHtml(hiddenNames, me);
                }
                moreWrap.hidden = false;
                moreWrap.classList.remove('is-hidden');
                moreWrap.setAttribute('aria-label', formatPeopleCountRu(hiddenCount));
                bindCardParticipantMoreWrap(moreWrap);
            } else if (moreWrap) {
                moreWrap.hidden = true;
                moreWrap.classList.add('is-hidden');
                if (moreWrap.classList.contains('is-tooltip-open')) {
                    closeCardParticipantsTooltip(moreWrap);
                    if (activeCardParticipantsTooltipWrap === moreWrap) activeCardParticipantsTooltipWrap = null;
                }
            }
        }

        function layoutAllCardParticipants() {
            document.querySelectorAll('.card-participants').forEach(layoutCardParticipants);
        }

        function updateTaskListScrollable() {
            document.querySelectorAll('#board .task-list').forEach((list) => {
                const needsScroll = list.scrollHeight > list.clientHeight + 1;
                list.classList.toggle('is-scrollable', needsScroll);
            });
        }

        function ensureTaskListWheelScroll() {
            const board = document.getElementById('board');
            if (!board || board._taskListWheelBound) return;
            board._taskListWheelBound = true;
            board.addEventListener('wheel', (e) => {
                const list = e.target && e.target.closest ? e.target.closest('.task-list') : null;
                if (!list || !board.contains(list) || !list.classList.contains('is-scrollable')) return;
                const delta = e.deltaY;
                if (!delta) return;
                const maxScroll = list.scrollHeight - list.clientHeight;
                if (maxScroll <= 0) return;
                const atTop = list.scrollTop <= 0;
                const atBottom = list.scrollTop >= maxScroll - 1;
                if ((delta < 0 && atTop) || (delta > 0 && atBottom)) return;
                // Keep vertical scroll inside the column; don't nudge the board sideways
                e.preventDefault();
                list.scrollTop += delta;
            }, { passive: false });
        }

        let cardParticipantsLayoutObserver = null;
        function ensureCardParticipantsLayoutObserver() {
            const board = document.getElementById('board');
            if (!board || cardParticipantsLayoutObserver) return;
            let timer = null;
            cardParticipantsLayoutObserver = new ResizeObserver(() => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    layoutAllCardParticipants();
                    updateTaskListScrollable();
                }, 80);
            });
            cardParticipantsLayoutObserver.observe(board);
        }

        function getCardParticipantsTooltipEl(wrap) {
            if (!wrap) return null;
            if (wrap._portalTooltip && document.body.contains(wrap._portalTooltip)) return wrap._portalTooltip;
            return wrap.querySelector('.card-participants-tooltip');
        }

        function ensureCardParticipantsTooltipContent(wrap) {
            const tooltip = getCardParticipantsTooltipEl(wrap);
            if (!tooltip || !wrap) return tooltip;
            const container = wrap.closest('.card-participants');
            if (!container) return tooltip;
            const avatars = Array.from(container.querySelectorAll('.card-participant-avatar'));
            const visibleCount = parseInt(container.getAttribute('data-participant-visible') || '0', 10) || 0;
            const hiddenNames = avatars.slice(visibleCount)
                .map(a => a.getAttribute('data-participant-name') || '')
                .filter(Boolean);
            if (!hiddenNames.length) return tooltip;
            const me = typeof getCurrentUser === 'function' ? getCurrentUser() : '';
            tooltip.innerHTML = buildCardParticipantsTooltipHtml(hiddenNames, me);
            return tooltip;
        }

        function closeCardParticipantsTooltip(wrap) {
            if (!wrap) return;
            wrap.classList.remove('is-tooltip-open');
            const tooltip = getCardParticipantsTooltipEl(wrap);
            if (!tooltip) return;
            tooltip.classList.remove('is-open');
            tooltip.style.top = '';
            tooltip.style.left = '';
            // Return portal tooltip back into the wrap
            if (tooltip.parentElement === document.body) {
                wrap.appendChild(tooltip);
            }
            wrap._portalTooltip = null;
        }

        function closeAllCardParticipantsTooltips() {
            document.querySelectorAll('.card-participant-more-wrap.is-tooltip-open').forEach(closeCardParticipantsTooltip);
            document.querySelectorAll('.card-participants-tooltip.is-open').forEach((tip) => {
                tip.classList.remove('is-open');
                tip.style.top = '';
                tip.style.left = '';
            });
        }

        function positionCardParticipantsTooltip(wrap, tooltip) {
            const more = wrap.querySelector('.card-participant-more');
            if (!tooltip || !more || !tooltip.innerHTML.trim()) return;
            // Measure while invisible but in flow of fixed layer
            tooltip.style.visibility = 'hidden';
            tooltip.style.opacity = '0';
            tooltip.style.display = 'block';
            const moreRect = more.getBoundingClientRect();
            const tipW = tooltip.offsetWidth || 140;
            const tipH = tooltip.offsetHeight || 56;
            let top = moreRect.top - tipH - 8;
            let left = moreRect.right - tipW;
            if (top < 8) top = moreRect.bottom + 8;
            left = Math.max(8, Math.min(left, window.innerWidth - tipW - 8));
            top = Math.max(8, Math.min(top, window.innerHeight - tipH - 8));
            tooltip.style.top = `${top}px`;
            tooltip.style.left = `${left}px`;
            tooltip.style.visibility = '';
            tooltip.style.opacity = '';
            tooltip.style.display = '';
        }

        let activeCardParticipantsTooltipWrap = null;
        let cardParticipantsTooltipCloseTimer = null;

        function openCardParticipantsTooltip(wrap) {
            if (!wrap || wrap.hidden || wrap.classList.contains('is-hidden')) return;
            clearTimeout(cardParticipantsTooltipCloseTimer);
            if (activeCardParticipantsTooltipWrap === wrap && wrap.classList.contains('is-tooltip-open')) return;
            closeAllCardParticipantsTooltips();
            activeCardParticipantsTooltipWrap = wrap;

            const tooltip = ensureCardParticipantsTooltipContent(wrap);
            if (!tooltip || !tooltip.innerHTML.trim()) return;

            // Portal to body — avoids clipping by column overflow / card transform
            wrap._portalTooltip = tooltip;
            document.body.appendChild(tooltip);
            wrap.classList.add('is-tooltip-open');
            positionCardParticipantsTooltip(wrap, tooltip);
            requestAnimationFrame(() => {
                if (activeCardParticipantsTooltipWrap === wrap) {
                    tooltip.classList.add('is-open');
                    positionCardParticipantsTooltip(wrap, tooltip);
                }
            });
        }

        function scheduleCloseCardParticipantsTooltip(wrap) {
            clearTimeout(cardParticipantsTooltipCloseTimer);
            cardParticipantsTooltipCloseTimer = setTimeout(() => {
                if (activeCardParticipantsTooltipWrap !== wrap) return;
                closeCardParticipantsTooltip(wrap);
                activeCardParticipantsTooltipWrap = null;
            }, 80);
        }

        function bindCardParticipantMoreWrap(wrap) {
            if (!wrap || wrap.dataset.tooltipBound === '1') return;
            wrap.dataset.tooltipBound = '1';
            wrap.addEventListener('mouseenter', () => openCardParticipantsTooltip(wrap));
            wrap.addEventListener('mouseleave', () => scheduleCloseCardParticipantsTooltip(wrap));
            wrap.addEventListener('focusin', () => openCardParticipantsTooltip(wrap));
            wrap.addEventListener('focusout', (e) => {
                const related = e.relatedTarget;
                if (related && wrap.contains(related)) return;
                scheduleCloseCardParticipantsTooltip(wrap);
            });
        }

        let cardParticipantsTooltipBound = false;
        function ensureCardParticipantsTooltipHover() {
            const board = document.getElementById('board');
            if (!board || cardParticipantsTooltipBound) return;
            cardParticipantsTooltipBound = true;
            board.addEventListener('scroll', () => {
                clearTimeout(cardParticipantsTooltipCloseTimer);
                closeAllCardParticipantsTooltips();
                activeCardParticipantsTooltipWrap = null;
            }, true);
            window.addEventListener('scroll', () => {
                clearTimeout(cardParticipantsTooltipCloseTimer);
                closeAllCardParticipantsTooltips();
                activeCardParticipantsTooltipWrap = null;
            }, true);
            window.addEventListener('resize', () => {
                clearTimeout(cardParticipantsTooltipCloseTimer);
                closeAllCardParticipantsTooltips();
                activeCardParticipantsTooltipWrap = null;
            });
        }

            listEl.querySelectorAll('.board-tile').forEach(tile => {

        /** Normalize Quill HTML so empty/equivalent markup doesn't look like edits */

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')

        /** Selected column keys to show. Empty = all columns. Persist per user+board. */
        let selectedColumnKeys = [];
        /** People filter selection. Empty = all cards. Cut by status is dropped (not restored). */
        let preferredPeopleNames = [];
        /** Active people filter (same as preferred after sync). Empty = all cards. OR-match. */
        let selectedPeopleNames = [];
        /** 'all' | 'open' | 'done' */
        let doneFilterMode = 'all';
        let boardFilterSkipAnim = false;
        let boardFiltersHydrated = false;
        const COLUMN_FILTER_ANIM_MS = 280;

        function getColumnKey(colOrEl) {
            if (!colOrEl) return '';
            if (colOrEl.getAttribute) {
                return (colOrEl.getAttribute('data-folder') || colOrEl.getAttribute('data-name') || '').trim();
            }
            return String(colOrEl.folder || colOrEl.name || '').trim();
        }

        function getColumnFilterStorageKey() {
            const user = getCurrentUser() || 'anonymous';
            const board = currentBoardId || 'noboard';
            return 'sb_col_filter_v1|' + user + '|' + board;
        }
        function getPeopleFilterStorageKey() {
            const user = getCurrentUser() || 'anonymous';
            const board = currentBoardId || 'noboard';
            return 'sb_people_filter_v1|' + user + '|' + board;
        }
        function getDoneFilterStorageKey() {
            const user = getCurrentUser() || 'anonymous';
            const board = currentBoardId || 'noboard';
            return 'sb_done_filter_v1|' + user + '|' + board;
        }

        function loadBoardFiltersFromStorage() {
            const me = getCurrentUser();
            selectedColumnKeys = [];
            preferredPeopleNames = me ? [me] : [];
            doneFilterMode = 'all';
            try {
                const colRaw = localStorage.getItem(getColumnFilterStorageKey());
                if (colRaw != null) {
                    const parsed = JSON.parse(colRaw);
                    if (Array.isArray(parsed)) {
                        selectedColumnKeys = parsed.map(k => String(k || '').trim()).filter(Boolean);
                    }
                }
            } catch (e) {}
            try {
                const peopleRaw = localStorage.getItem(getPeopleFilterStorageKey());
                if (peopleRaw != null) {
                    const parsed = JSON.parse(peopleRaw);
                    if (Array.isArray(parsed)) {
                        preferredPeopleNames = parsed.map(k => String(k || '').trim()).filter(Boolean);
                    }
                }
            } catch (e) {}
            try {
                const doneRaw = localStorage.getItem(getDoneFilterStorageKey());
                if (doneRaw === 'all' || doneRaw === 'open' || doneRaw === 'done') doneFilterMode = doneRaw;
            } catch (e) {}
            syncSelectedColumnsAgainstAvailable();
            syncActivePeopleFromPreferred();
            boardFiltersHydrated = true;
        }

        function saveColumnFilterToStorage() {
            try {
                localStorage.setItem(getColumnFilterStorageKey(), JSON.stringify(selectedColumnKeys));
            } catch (e) {}
        }

        function savePeopleFilterToStorage() {
            try {
                localStorage.setItem(getPeopleFilterStorageKey(), JSON.stringify(preferredPeopleNames));
            } catch (e) {}
        }

        /** Drop people not on cards under current status + selected columns (unchecked in filter). */
        function syncActivePeopleFromPreferred() {
            if (!preferredPeopleNames.length) {
                selectedPeopleNames = [];
                return;
            }
            // Before board data is ready, keep stored selection as-is
            if (!Array.isArray(lastData)) {
                selectedPeopleNames = preferredPeopleNames.slice();
                return;
            }
            const available = new Set(collectPeopleFilterNames('view'));
            const next = preferredPeopleNames.filter(n => available.has(n));
            if (next.length !== preferredPeopleNames.length) {
                preferredPeopleNames = next;
                savePeopleFilterToStorage();
            }
            selectedPeopleNames = next;
        }
        function saveDoneFilterToStorage() {
            try {
                localStorage.setItem(getDoneFilterStorageKey(), doneFilterMode);
            } catch (e) {}

        function prefersReducedMotion() {
            try {
                return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            } catch (e) {
                return false;
            }
        }

        function isColumnFilterAll() {
            return !selectedColumnKeys.length;
        }
        function isPeopleFilterAll() {
            return !selectedPeopleNames.length;
        }
        function isPeopleFilterMeOnly() {
            const me = getCurrentUser();
            return !!(me && selectedPeopleNames.length === 1 && selectedPeopleNames[0] === me);
        }
        function isCardFiltersIdle() {
            return isPeopleFilterAll() && doneFilterMode === 'all';

        function isBoardFiltersIdle() {

        function collectColumnFilterItems() {
            return (lastData || []).map((col) => {
                const key = getColumnKey(col);
                const name = String(col.name || col.folder || key || '').trim();
                return { key, name };
            }).filter(c => c.key);
        }

        function syncSelectedColumnsAgainstAvailable() {
            if (!selectedColumnKeys.length) return;
            if (!Array.isArray(lastData)) return;
            const available = new Set(collectColumnFilterItems().map(c => c.key));
            const next = selectedColumnKeys.filter(k => available.has(k));
            if (next.length !== selectedColumnKeys.length) {
                selectedColumnKeys = next;
                saveColumnFilterToStorage();
            }
        }

        function columnMatchesFilter(colOrEl) {
            if (isColumnFilterAll()) return true;
            const key = getColumnKey(colOrEl);
            return !!(key && selectedColumnKeys.includes(key));
        }

        function isTaskDone(task) {
            if (!task) return false;
            return !!(task.done || localStorage.getItem(`done_${task.relPath}`) === 'true');
        }

        function findTaskByRelPath(relPath) {
            const norm = String(relPath || '').replace(/\\/g, '/');
            if (!norm || !lastData) return null;
            for (const col of lastData) {
                const t = (col.tasks || []).find(x => (x.relPath || '').replace(/\\/g, '/') === norm);
                if (t) return t;
            }
            return null;
        }

        function taskMatchesPeopleFilter(task) {
            if (isPeopleFilterAll()) return true;
            const parts = (task.participants || []).map(p => String(p).trim()).filter(Boolean);
            return selectedPeopleNames.some(n => parts.includes(n));
        }

        function taskMatchesDoneFilter(task) {
            if (doneFilterMode === 'all') return true;
            const done = isTaskDone(task);
            return doneFilterMode === 'done' ? done : !done;
        }

        /**
         * People present on cards for current status (+ selected columns when column filter is on).
         * @param {'view'|'board'} scope  board = ignore column filter (rare); view = respect it
         */
        function collectPeopleFilterNames(scope) {
            const set = new Set();
            const me = getCurrentUser();
            const limitColumns = scope !== 'board' && !isColumnFilterAll();
            (lastData || []).forEach(col => {
                if (limitColumns && !columnMatchesFilter(col)) return;
                (col.tasks || []).forEach(t => {
                    if (!taskMatchesDoneFilter(t)) return;
                    (t.participants || []).forEach(p => {
                        const n = String(p || '').trim();
                        if (n) set.add(n);
                    });
                });
            });
            // Full directory only when no column filter and status = all
            if (doneFilterMode === 'all' && !limitColumns) {
                if (me) set.add(me);
                getCardPickerNames().forEach(n => {
                    const s = String(n || '').trim();
                    if (s) set.add(s);
                });
            }
            const names = Array.from(set);
            names.sort((a, b) => {
                if (me && a === me) return -1;
                if (me && b === me) return 1;
                return a.localeCompare(b, 'ru');
            });
            return names;
        }

            if (!q) return true;

        function renderPeopleFilterList() {

                const isMe = me && name === me;
                const label = formatCardUserLabel(name) + (isMe ? ' (я)' : '');
                return `<label class="column-filter-row${isMe ? ' people-filter-row-me' : ''}">
                    <input type="checkbox" class="people-filter-check" data-person-name="${escapeHtml(name)}" ${checked ? 'checked' : ''}>
                    <span class="column-filter-row-name" title="${escapeHtml(name)}">${escapeHtml(label)}</span>
                </label>`;
            }).join('');
        }

        function clearColumnFilterAnimTimers(colEl) {
            if (colEl._colFilterAnimTimer) {
                clearTimeout(colEl._colFilterAnimTimer);
                colEl._colFilterAnimTimer = null;
            }
            if (colEl._colFilterRaf) {
                cancelAnimationFrame(colEl._colFilterRaf);
                colEl._colFilterRaf = null;
            }
            if (colEl._colFilterOnEnd) {
                colEl.removeEventListener('transitionend', colEl._colFilterOnEnd);
                colEl._colFilterOnEnd = null;
            }
        }

        function finishHideColumn(colEl) {
            colEl.classList.add('column-filter-hidden');
            colEl.classList.remove('column-filter-leave', 'column-filter-enter', 'column-filter-enter-active');
            if (colEl._colFilterOnEnd) {
                colEl.removeEventListener('transitionend', colEl._colFilterOnEnd);
                colEl._colFilterOnEnd = null;
            }
            colEl._colFilterAnimTimer = null;
        }

        function hideColumnWithAnim(colEl) {
            if (colEl.classList.contains('column-filter-hidden') && !colEl.classList.contains('column-filter-leave')) {
                return;
            }
            if (colEl.classList.contains('column-filter-leave')) return;

            clearColumnFilterAnimTimers(colEl);
            if (boardFilterSkipAnim || prefersReducedMotion()) {
                finishHideColumn(colEl);
                return;
            }

            colEl.classList.remove('column-filter-hidden');
            colEl.classList.add('column-filter-leave');
            colEl.classList.remove('column-filter-enter', 'column-filter-enter-active');
            void colEl.offsetWidth;

            const onEnd = (e) => {
                if (e.target !== colEl || (e.propertyName && e.propertyName !== 'width')) return;
                finishHideColumn(colEl);
            };
            colEl._colFilterOnEnd = onEnd;
            colEl.addEventListener('transitionend', onEnd);
            colEl._colFilterAnimTimer = setTimeout(() => {
                if (!colEl.classList.contains('column-filter-leave')) return;
                finishHideColumn(colEl);
            }, COLUMN_FILTER_ANIM_MS + 60);
        }

        function showColumnWithAnim(colEl) {
            const wasHidden =
                colEl.classList.contains('column-filter-hidden') ||
                colEl.classList.contains('column-filter-leave') ||
                colEl.classList.contains('column-filter-enter');

            clearColumnFilterAnimTimers(colEl);

            if (!wasHidden || boardFilterSkipAnim || prefersReducedMotion()) {
                colEl.classList.remove('column-filter-hidden', 'column-filter-leave', 'column-filter-enter', 'column-filter-enter-active');
                return;
            }

            colEl.classList.add('column-filter-enter');
            colEl.classList.remove('column-filter-hidden', 'column-filter-leave', 'column-filter-enter-active');
            void colEl.offsetWidth;

            colEl._colFilterRaf = requestAnimationFrame(() => {
                colEl._colFilterRaf = requestAnimationFrame(() => {
                    colEl._colFilterRaf = null;
                    if (!colEl.classList.contains('column-filter-enter')) return;
                    colEl.classList.add('column-filter-enter-active');
                    colEl.classList.remove('column-filter-enter');
                    colEl._colFilterAnimTimer = setTimeout(() => {
                        colEl.classList.remove('column-filter-enter-active');
                        colEl._colFilterAnimTimer = null;
                    }, COLUMN_FILTER_ANIM_MS + 60);
                });
            });
        }

        function clearCardFilterAnimTimers(cardEl) {
            if (cardEl._cardFilterAnimTimer) {
                clearTimeout(cardEl._cardFilterAnimTimer);
                cardEl._cardFilterAnimTimer = null;
            }
            if (cardEl._cardFilterRaf) {
                cancelAnimationFrame(cardEl._cardFilterRaf);
                cardEl._cardFilterRaf = null;
            }
            if (cardEl._cardFilterOnEnd) {
                cardEl.removeEventListener('transitionend', cardEl._cardFilterOnEnd);
                cardEl._cardFilterOnEnd = null;
            }
        }

        function finishHideCard(cardEl) {
            cardEl.classList.add('card-board-filter-hidden');
            cardEl.classList.remove('card-filter-leave', 'card-filter-enter', 'card-filter-enter-active');
            if (cardEl._cardFilterOnEnd) {
                cardEl.removeEventListener('transitionend', cardEl._cardFilterOnEnd);
                cardEl._cardFilterOnEnd = null;
            }
            cardEl._cardFilterAnimTimer = null;
        }

        function hideCardWithAnim(cardEl) {
            if (cardEl.classList.contains('card-board-filter-hidden') && !cardEl.classList.contains('card-filter-leave')) {
                return;
            }
            if (cardEl.classList.contains('card-filter-leave')) return;

            clearCardFilterAnimTimers(cardEl);
            if (boardFilterSkipAnim || prefersReducedMotion()) {
                finishHideCard(cardEl);
                return;
            }

            // Paint at full opacity first, then leave — otherwise transition is skipped
            cardEl.classList.remove('card-board-filter-hidden', 'card-filter-enter', 'card-filter-enter-active', 'card-filter-leave');
            void cardEl.offsetWidth;

            const onEnd = (e) => {
                if (e.target !== cardEl || (e.propertyName && e.propertyName !== 'opacity')) return;
                finishHideCard(cardEl);
            };
            cardEl._cardFilterOnEnd = onEnd;
            cardEl.addEventListener('transitionend', onEnd);
            cardEl._cardFilterAnimTimer = setTimeout(() => {
                if (!cardEl.classList.contains('card-filter-leave')) return;
                finishHideCard(cardEl);
            }, COLUMN_FILTER_ANIM_MS + 80);

            cardEl._cardFilterRaf = requestAnimationFrame(() => {
                cardEl._cardFilterRaf = null;
                if (cardEl.classList.contains('card-board-filter-hidden')) return;
                cardEl.classList.add('card-filter-leave');
            });
        }

        function showCardWithAnim(cardEl) {
            const wasHidden =
                cardEl.classList.contains('card-board-filter-hidden') ||
                cardEl.classList.contains('card-filter-leave') ||
                cardEl.classList.contains('card-filter-enter');

            clearCardFilterAnimTimers(cardEl);

            if (!wasHidden || boardFilterSkipAnim || prefersReducedMotion()) {
                cardEl.classList.remove('card-board-filter-hidden', 'card-filter-leave', 'card-filter-enter', 'card-filter-enter-active');
                return;
            }

            cardEl.classList.add('card-filter-enter');
            cardEl.classList.remove('card-board-filter-hidden', 'card-filter-leave', 'card-filter-enter-active');
            void cardEl.offsetWidth;

            cardEl._cardFilterRaf = requestAnimationFrame(() => {
                cardEl._cardFilterRaf = requestAnimationFrame(() => {
                    cardEl._cardFilterRaf = null;
                    if (!cardEl.classList.contains('card-filter-enter')) return;
                    cardEl.classList.add('card-filter-enter-active');
                    cardEl.classList.remove('card-filter-enter');
                    cardEl._cardFilterAnimTimer = setTimeout(() => {
                        cardEl.classList.remove('card-filter-enter-active');
                        cardEl._cardFilterAnimTimer = null;
                    }, COLUMN_FILTER_ANIM_MS + 60);
                });
            });
        }

        function applyBoardFilters() {
            if (!boardFiltersHydrated) loadBoardFiltersFromStorage();
            syncSelectedColumnsAgainstAvailable();
            syncActivePeopleFromPreferred();
            const cardIdle = isCardFiltersIdle();
            document.querySelectorAll('#board .column').forEach((colEl) => {
                const colAllowed = columnMatchesFilter(colEl);
                let visibleCards = 0;
                // Always update cards (people/status), even in columns hidden by column filter
                colEl.querySelectorAll('.card').forEach((cardEl) => {
                    const raw = cardEl.getAttribute('data-rel-path') || '';
                    const relPath = raw.replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                    const task = findTaskByRelPath(relPath);
                    const show = colAllowed && !!(task && taskMatchesPeopleFilter(task) && taskMatchesDoneFilter(task));
                    if (show) {
                        showCardWithAnim(cardEl);
                        visibleCards += 1;
                    } else {
                        hideCardWithAnim(cardEl);
                    }
                });
                const shouldShowCol = colAllowed && (cardIdle || visibleCards > 0);
                if (shouldShowCol) showColumnWithAnim(colEl);
                else hideColumnWithAnim(colEl);
            });
            updateColumnFilterBadge();
            updatePeopleFilterBadge();
            updateDoneFilterUi();
            renderPeopleFilterList();
            renderBoardFilterChips();
            requestAnimationFrame(updateTaskListScrollable);

        function getBoardFilterChipSpecs() {
            const specs = [];
            if (!isColumnFilterAll()) {
                const byKey = new Map(collectColumnFilterItems().map(c => [c.key, c.name]));
                selectedColumnKeys.forEach((key) => {
                    const name = byKey.get(key) || key;
                    specs.push({
                        key: 'column:' + key,
                        type: 'column',
                        name: '',
                        columnKey: key,
                        title: name + ' — нажмите, чтобы снять',

                        html:
                            `<span class="filter-chip-kind">Колонка</span>` +
                            `<span class="filter-chip-dot" aria-hidden="true">·</span>` +
                            `<span class="filter-chip-value">${escapeHtml(name)}</span>`
                    });
                });
            }
            selectedPeopleNames.forEach((name) => {
                const label = formatCardUserLabel(name);
                specs.push({
                    key: 'person:' + name,
                    type: 'person',
                    name,
                    title: name + ' — нажмите, чтобы снять',
                    className: 'filter-chip filter-chip-person',
                    html:
                        renderUserAvatarHtml(name, 'sm') +
                        `<span class="filter-chip-kind">Участник</span>` +
                        `<span class="filter-chip-dot" aria-hidden="true">·</span>` +
                        `<span class="filter-chip-value">${escapeHtml(label)}</span>`
                });
            });
            if (doneFilterMode === 'done' || doneFilterMode === 'open') {
                const value = doneFilterMode === 'done' ? 'Выполнено' : 'Не выполнено';
                const cls = doneFilterMode === 'done' ? 'filter-chip-status-done' : 'filter-chip-status-open';
                specs.push({
                    key: 'done:' + doneFilterMode,
                    type: 'done',
                    name: '',
                    title: 'Статус: ' + value + ' — нажмите, чтобы снять',
                    className: 'filter-chip filter-chip-status ' + cls,
                    html:
                        `<span class="filter-chip-kind">Статус</span>` +
                        `<span class="filter-chip-dot" aria-hidden="true">·</span>` +
                        `<span class="filter-chip-value">${value}</span>`
                });
            }
            return specs;
        }

        function scheduleFilterChipRemove(el) {
            if (!el || el._chipRemoveScheduled) return;
            el._chipRemoveScheduled = true;
            const finish = () => {
                if (el.parentNode) el.parentNode.removeChild(el);
            };
            el.addEventListener('transitionend', (ev) => {
                if (ev.target !== el) return;
                finish();
            }, { once: true });
            setTimeout(finish, 320);
        }

        function renderBoardFilterChips() {
            const row = document.getElementById('board-filter-chips');
            if (!row) return;
            const specs = getBoardFilterChipSpecs();
            const desired = new Set(specs.map(s => s.key));
            const existing = Array.from(row.querySelectorAll('.filter-chip'));

            existing.forEach((el) => {
                const key = el.getAttribute('data-filter-key') || '';
                if (desired.has(key)) return;
                if (!el.classList.contains('is-leaving')) {
                    el.classList.add('is-leaving');
                    el.setAttribute('aria-hidden', 'true');
                    scheduleFilterChipRemove(el);
                }
            });

            const alive = () => Array.from(row.querySelectorAll('.filter-chip:not(.is-leaving)'));
            specs.forEach((spec, index) => {
                let el = alive().find(c => c.getAttribute('data-filter-key') === spec.key);
                if (!el) {
                    el = document.createElement('button');
                    el.type = 'button';
                    el.className = spec.className + ' is-entering';
                    el.setAttribute('data-filter-key', spec.key);
                    el.setAttribute('data-filter-chip', spec.type);
                    if (spec.name) el.setAttribute('data-person-name', spec.name);
                    if (spec.columnKey) el.setAttribute('data-column-key', spec.columnKey);
                    el.title = spec.title;
                    el.setAttribute('aria-label', spec.title);
                    el.innerHTML = spec.html;
                    const before = alive()[index];
                    if (before && before.parentNode === row) row.insertBefore(el, before);
                    else row.appendChild(el);
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => el.classList.remove('is-entering'));
                    });
                    return;
                }
                el.className = spec.className;
                el.setAttribute('data-filter-chip', spec.type);
                if (spec.name) el.setAttribute('data-person-name', spec.name);
                else el.removeAttribute('data-person-name');
                if (spec.columnKey) el.setAttribute('data-column-key', spec.columnKey);
                else el.removeAttribute('data-column-key');
                el.title = spec.title;
                el.setAttribute('aria-label', spec.title);
                el.innerHTML = spec.html;
                const nodes = alive();
                const at = nodes[index];
                if (at !== el) {
                    const before = nodes[index];
                    if (before) row.insertBefore(el, before);
                    else row.appendChild(el);
                }
            });
        }

        function removeBoardFilterChip(chip) {
            if (!chip || chip.classList.contains('is-leaving')) return;
            const type = chip.getAttribute('data-filter-chip');
            if (type === 'column') {
                const key = chip.getAttribute('data-column-key') || '';
                selectedColumnKeys = selectedColumnKeys.filter(k => k !== key);
                saveColumnFilterToStorage();
                renderColumnFilterList();
                applyBoardFilters();
                return;
            }
            if (type === 'person') {
                const name = chip.getAttribute('data-person-name') || '';
                preferredPeopleNames = preferredPeopleNames.filter(n => n !== name);
                syncActivePeopleFromPreferred();
                savePeopleFilterToStorage();
                renderPeopleFilterList();
                applyBoardFilters();
                return;
            }
            if (type === 'done') {
                setDoneFilterMode('all', true);
            }
        }

        function setColumnFilterSelection(keys, persist) {
            const available = collectColumnFilterItems().map(c => c.key);
            const availSet = new Set(available);
            let chosen = (keys || []).map(k => String(k || '').trim()).filter(k => availSet.has(k));
            if (chosen.length && chosen.length === available.length) chosen = [];
            selectedColumnKeys = chosen;
            if (persist !== false) saveColumnFilterToStorage();
            // People not in selected columns drop out of the people filter
            syncActivePeopleFromPreferred();
            renderColumnFilterList();
            renderPeopleFilterList();
            applyBoardFilters();
        }

        function clearColumnFilterSelection(persist) {
            selectedColumnKeys = [];
            if (persist !== false) saveColumnFilterToStorage();
            syncActivePeopleFromPreferred();
            renderColumnFilterList();
            renderPeopleFilterList();
            applyBoardFilters();
        }

        function setPeopleFilterSelection(names, persist) {
            const available = new Set(collectPeopleFilterNames('view'));
            const chosen = (names || []).map(k => String(k || '').trim()).filter(Boolean);
            preferredPeopleNames = chosen.filter(n => available.has(n));
            syncActivePeopleFromPreferred();
            if (persist !== false) savePeopleFilterToStorage();
            renderPeopleFilterList();
            applyBoardFilters();
        }

        function clearPeopleFilterSelection(persist) {
            preferredPeopleNames = [];
            selectedPeopleNames = [];
            if (persist !== false) savePeopleFilterToStorage();
            renderPeopleFilterList();
            applyBoardFilters();
        }

        function setPeopleFilterMe(persist) {

            preferredPeopleNames = me ? [me] : [];
            syncActivePeopleFromPreferred();
            if (persist !== false) savePeopleFilterToStorage();
            renderPeopleFilterList();
            applyBoardFilters();

        function setDoneFilterMode(mode, persist) {
            doneFilterMode = (mode === 'done' || mode === 'open') ? mode : 'all';
            if (persist !== false) saveDoneFilterToStorage();
            // People cut by status are removed from selection and stay removed after status clears
            syncActivePeopleFromPreferred();
            renderPeopleFilterList();
            updateDoneFilterUi();
            applyBoardFilters();
        }

        function closeBoardFilterDropdowns() {
            document.getElementById('column-filter-dropdown')?.classList.remove('is-open');
            document.getElementById('people-filter-dropdown')?.classList.remove('is-open');
            document.getElementById('done-filter-dropdown')?.classList.remove('is-open');
            const colSearch = document.getElementById('column-filter-search');
            if (colSearch) colSearch.value = '';
            const peopleSearch = document.getElementById('people-filter-search');
            if (peopleSearch) peopleSearch.value = '';
        }

        function toggleColumnFilterDropdown(forceOpen) {
            const dd = document.getElementById('column-filter-dropdown');
            if (!dd) return;
            const isOpen = dd.classList.contains('is-open');
            const open = forceOpen === true ? true : forceOpen === false ? false : !isOpen;
            document.getElementById('people-filter-dropdown')?.classList.remove('is-open');
            document.getElementById('done-filter-dropdown')?.classList.remove('is-open');
            dd.classList.toggle('is-open', open);
            const searchEl = document.getElementById('column-filter-search');
            if (open) {
                renderColumnFilterList();
                if (searchEl) {
                    searchEl.focus();
                    searchEl.select();
                }
            } else if (searchEl && searchEl.value) {
                searchEl.value = '';
            }
        }

        function togglePeopleFilterDropdown(forceOpen) {
            const dd = document.getElementById('people-filter-dropdown');
            if (!dd) return;
            const isOpen = dd.classList.contains('is-open');
            const open = forceOpen === true ? true : forceOpen === false ? false : !isOpen;
            document.getElementById('column-filter-dropdown')?.classList.remove('is-open');
            document.getElementById('done-filter-dropdown')?.classList.remove('is-open');
            dd.classList.toggle('is-open', open);
            const searchEl = document.getElementById('people-filter-search');
            if (open) {
                renderPeopleFilterList();
                if (searchEl) {
                    searchEl.focus();
                    searchEl.select();
                }

                searchEl.value = '';

        function toggleDoneFilterDropdown(forceOpen) {
            const dd = document.getElementById('done-filter-dropdown');
            if (!dd) return;
            const isOpen = dd.classList.contains('is-open');
            const open = forceOpen === true ? true : forceOpen === false ? false : !isOpen;
            document.getElementById('column-filter-dropdown')?.classList.remove('is-open');
            document.getElementById('people-filter-dropdown')?.classList.remove('is-open');

        function setBoardFiltersVisible(visible) {
